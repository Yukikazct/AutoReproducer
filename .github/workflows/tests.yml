name: Python regression tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    # Windows runs both complete encoding selections sequentially. The 3.11
    # runner exceeded 30 minutes with dependency setup and both full suites.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 45 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    defaults:
      run:
        working-directory: AutoReproducer
    env:
      PYTHONIOENCODING: utf-8
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
          cache: pip
          cache-dependency-path: |
            AutoReproducer/requirements.txt
            AutoReproducer/requirements-test.txt
      - name: Create isolated CI environment
        shell: pwsh
        run: |
          $ciEnvironment = Join-Path $env:RUNNER_TEMP 'autoreproducer-ci'
          python -m venv $ciEnvironment
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $scriptsDirectory = if ($IsWindows) { 'Scripts' } else { 'bin' }
          "VIRTUAL_ENV=$ciEnvironment" >> $env:GITHUB_ENV
          (Join-Path $ciEnvironment $scriptsDirectory) >> $env:GITHUB_PATH
      - name: Install production dependencies
        run: python -m pip install --no-user --report app-dependencies.json -r requirements.txt
      - name: Validate production dependency metadata
        run: python -m pip check
      - name: Check application health before installing test dependencies
        run: python -c "import platform,sys; from src.runtime_preparation import runtime_requirement; print(sys.version); print(platform.platform()); issue = runtime_requirement(); assert issue is None, issue"
      - name: Record installer version
        run: python -m pip --version
      - name: Install test dependencies
        id: dependencies
        run: python -m pip install --no-user --report test-dependencies.json -r requirements-test.txt
      - name: Validate test dependency metadata
        run: python -m pip check
      - name: Validate dependency and file management with locale encoding
        env:
          PYTHONUTF8: '0'
        run: >-
          python -m pytest -q -ra
          tests/test_project_file_management.py
          tests/test_file_removal.py
          tests/test_resource_manager.py tests/test_resource_cli.py
          tests/test_history_manager.py tests/test_history_storage_snapshot.py
          tests/test_dependency_management.py tests/test_dependency_cache_lifecycle.py
          tests/test_dependency_health_repair.py tests/test_safe_runtime_preparation.py
          tests/test_runtime_preparation.py tests/test_runtime_platform.py
          tests/test_exec_output_encoding.py
          --junitxml=test-results-management-locale.xml
      - name: Validate Windows dependency and file management with UTF-8 mode
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.dependencies.outcome == 'success' }}
        run: >-
          python -X utf8 -m pytest -q -ra
          tests/test_project_file_management.py
          tests/test_file_removal.py
          tests/test_resource_manager.py tests/test_resource_cli.py
          tests/test_history_manager.py tests/test_history_storage_snapshot.py
          tests/test_dependency_management.py tests/test_dependency_cache_lifecycle.py
          tests/test_dependency_health_repair.py tests/test_safe_runtime_preparation.py
          tests/test_runtime_preparation.py tests/test_runtime_platform.py
          tests/test_exec_output_encoding.py
          --junitxml=test-results-management-utf8.xml
      - name: Run regression tests with locale encoding
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        env:
          PYTHONUTF8: '0'
        run: python -m pytest tests/ -q -ra --junitxml=test-results-locale.xml
      - name: Run Windows regression tests with UTF-8 mode
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.dependencies.outcome == 'success' }}
        run: python -X utf8 -m pytest tests/ -q -ra --junitxml=test-results-utf8.xml
      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ matrix.os }}-python-${{ matrix.python }}
          path: |
            AutoReproducer/test-results-*.xml
            AutoReproducer/app-dependencies.json
            AutoReproducer/test-dependencies.json
          if-no-files-found: ignore
