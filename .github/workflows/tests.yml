name: Python regression tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12']
    defaults:
      run:
        working-directory: AutoReproducer
    env:
      PYTHONIOENCODING: utf-8
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            AutoReproducer/requirements.txt
            AutoReproducer/requirements-test.txt
      - name: Install app and test dependencies
        id: dependencies
        run: python -m pip install --no-user -r requirements-test.txt
      - name: Run regression tests with locale encoding
        env:
          PYTHONUTF8: '0'
        run: python -m pytest tests/ -q -ra --junitxml=test-results-locale.xml
      - name: Run Windows regression tests with UTF-8 mode
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.dependencies.outcome == 'success' }}
        run: python -X utf8 -m pytest tests/ -q -ra --junitxml=test-results-utf8.xml
      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ matrix.os }}-python-${{ matrix.python }}
          path: AutoReproducer/test-results-*.xml
          if-no-files-found: ignore
